<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/formulario-telefone-receber-alertas.css}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail,call" />

</head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho-usuario}"></header>

    <div id="caixa-principal">
        <h2 id="titulo-cadastro">cadastro de telefone</h2>
        <div class="linha-titulo">
            <span class="azul"></span>
            <span class="vermelho"></span>
            <span class="azul"></span>
        </div>
        <div th:if="${!telCadastrado}">
            <p id="texto-cadastro">Inscreva seu número para receber alertas preventivos de desastres naturais na sua região via SMS.</p>
            <form th:action="@{/formtel}" th:method="post">
                <label for="input-telefone" id="label-telefone">Número de Telefone</label>
                <br>
                <input type="tel" placeholder="(15) 12345-6789" id="input-telefone" th:name="num_telefone">
                <div id="termos">
                    <input type="checkbox" id="aceitar-termos">
                    <label for="" id="termos-condicoes">Aceito os <a href="www.google.com" target="_blank" id="link-termos">Termos e Condições</a> para o envio de alertas.</label>
                </div>
                <button type="submit" id="botao-form-telefone">cadastrar</button>
            </form>
        </div>

        <div th:if="${telCadastrado}">
            <p id="texto-cadastrado">Seu telefone ja está cadastrado!</p>
            <a th:href="@{/}"><button type="submit" id="botao-form-telefone">voltar</button></a>
        </div>

    </div>

    <footer th:replace="~{fragments/rodape :: rodape-padrao}"></footer>
</body>
</html>
