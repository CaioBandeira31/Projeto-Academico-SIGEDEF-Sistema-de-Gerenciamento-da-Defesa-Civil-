<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/pagina-inicio.css}">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail,call" />

  

</head>
<body>

  <header th:replace="~{fragments/cabecalho :: cabecalho-usuario}"></header>
  <script th:src="@{/javascript/gif.js}" lang="javaScript"></script>
  <main>
    <div id="caixa-principal">
      <div id="caixa-titulo">
        <h1 id="titulo-principal">Serviços Disponíveis ao Cidadão</h1>
        <p id="subtitulo-principal">Selecione uma das opções abaixo para obter informações ou registrar ocorrências.</p>
      </div>
      <div class="caixa-informacoes">
        <a th:href="@{/denuncia}">
          <div id="denuncia" class="caixa-opcoes">
            <img id="aviso" th:src="@{/imagens/aviso.png}" alt="gif de denuncias" class="icone-inicio"></img>
            <div class="caixa-info">
              <h2 class="titulo-opcao">Denúncias</h2>
              <p class="texto-opcao">Acessar e monitorar ocorrências</p>
            </div>
          </div>
        </a>
        <a th:href="@{/previsao}">
          <div id="tempo" class="caixa-opcoes">
            <img id="chuva" th:src="@{/imagens/chuva.png}" alt="gif de tempo" class="icone-inicio"></img>
            <div class="caixa-info">
              <h2 class="titulo-opcao">Previsão do Tempo</h2>
              <p class="texto-opcao">Clima e alertas meteorológicos</p>
            </div>
          </div>
        </a>
        <a href="https://www.transparencia.sp.gov.br/" target="_blank">
          <div id="transparencia" class="caixa-opcoes">
            <img id="aperto-de-mao" th:src="@{/imagens/aperto-de-mao.png}" alt="gif de mao" class="icone-inicio"></img>
            <div class="caixa-info">
              <h2 class="titulo-opcao">Portal da Transparência</h2>
              <p class="texto-opcao">Contas públicas e convênios</p>
            </div>
          </div>
        </a>
        <a th:href="@{/tel}">
          <div id="sms" class="caixa-opcoes">
            <img id="telefone" th:src="@{/imagens/telefone.png}" alt="gif de telefone" class="icone-inicio"></img>
            <div class="caixa-info">
              <h2 class="titulo-opcao">SMS</h2>
              <p class="texto-opcao">Alertas rápidos em seu celular</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/rodape :: rodape-padrao}"></footer>

</body>
</html>
