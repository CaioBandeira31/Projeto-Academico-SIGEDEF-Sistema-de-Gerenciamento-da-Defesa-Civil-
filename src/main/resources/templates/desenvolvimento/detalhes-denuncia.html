<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes Denuncia</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/detalhes-denuncia.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,mail,call" />

</head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho-agente}"></header>
    
    <main>
      <div id="caixa-principal-denuncia">
        <div id="caixa-titulo-denuncia">
          <h1 id="titulo-denuncia">Ocorrencia: Protocolo</h1>
          <p id="subtitulo-denuncia"></p>
        </div>
        <div id="caixa-form-denuncia">
          <form th:action="@{/denuncia/salvar}" th:method="post">
            <div id="caixa-sup-denuncia">
              <div id="caixa-sup-esq">
                <h2 class="sequencia-denuncia">Informações da Ocorrencia</h2>
                <label for="endereco" class="label-denuncia">Endereço</label>
                <input type="text" id="endereco" th:value="${denuncia.endereco}" readonly disabled>
                <div id="caixa-dados-endereco">
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco1">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" th:value="${denuncia.bairro}" readonly disabled>
                  </div>
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco2">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" th:value="${denuncia.cidade}" readonly disabled>
                  </div>
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco3">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" th:value="${denuncia.cep}" readonly disabled>
                  </div>
                </div>
                <label for="referencia">Ponto de Referência</label>
                <input type="text" id="referencia" th:value="${denuncia.ponto_referencia}" readonly disabled>
            </div>
            </div>
            <div id="caixa-inf-denuncia">
              <h2 class="sequencia-denuncia">Tipo de Ocorrência</h2>
              <div id="caixa-botoes">
                <div id="caixa-botoes">
                  <button class="tipo-ocorrencia"
                          th:classappend="${denuncia.tipo_ocorrencia == 'Alagamento'} ? ' selecionado' : ''"
                          id="ocorrencia1" type="button">
                      Alagamento
                  </button>

                  <button class="tipo-ocorrencia"
                          th:classappend="${denuncia.tipo_ocorrencia == 'Risco de Desmoronamento'} ? ' selecionado' : ''"
                          id="ocorrencia2" type="button">
                      Risco de Desmoronamento
                  </button>

                  <button class="tipo-ocorrencia"
                          th:classappend="${denuncia.tipo_ocorrencia == 'Queda de Árvore'} ? ' selecionado' : ''"
                          id="ocorrencia3" type="button">
                      Queda de Árvore
                  </button>

                  <button class="tipo-ocorrencia"
                          th:classappend="${denuncia.tipo_ocorrencia == 'Outros'} ? ' selecionado' : ''"
                          id="ocorrencia4" type="button">
                      Outros
                  </button>
              </div>
              </div>
              <h2 class="sequencia-denuncia">Descrição da Ocorrência</h2>
              <div id="descricao-fatos">
                <label for="descricao">Descrição dos fatos constatados</label>
                <textarea name="" id="descricao" cols="30" rows="10" th:text="${denuncia.descricao_denuncia}" readonly disabled maxlength="512"></textarea>
              </div>
              <div>
                <input type="number" th:name="id" hidden th:value="${denuncia.id}">
                <h2>Alterar Situação da Ocorrencia</h2>
                <p th:text="('Situcação Atual: ' + ${denuncia.situacao})"></p>
                <p th:if="${denuncia.situacao == 'Resolvida'}" th:text="'A Denuncia foi marcada como Resolvida não é mais permitido a alteração deste campo.'"></p>
                <select class="input-filtro" th:name="situacao" id="" th:disabled="${denuncia.situacao == 'Resolvida'}" >
                    <option value="" selected disabled hidden>Definir</option>
                    <option value="Em Análise">Em análise</option>
                    <option value="Em Andamento">Em andamento</option>
                    <option value="Resolvida">Resolvida</option>
                </select>
                
                <h2 style="margin-top: 15px;">Definir Risco</h2>
                <p th:text="('Risco Atual: ' + ${denuncia.nivel_risco})"></p>
                <p th:if="${denuncia.situacao == 'Resolvida'}" th:text="'A Denuncia foi marcada como Resolvida não é mais permitido a alteração deste campo.'"></p>
                <select class="input-filtro" th:name="nivel_risco" id="" th:disabled="${denuncia.situacao == 'Resolvida'}">
                        <option value="" selected disabled hidden>Definir</option>
                        <option value="Baixo">Baixo</option>
                        <option value="Medio">Médio</option>
                        <option value="Alto">Alto</option>
                        <option value="Crítico">Critico</option>
                </select>
              </div>
            </div>

            <div id="caixa-botoes-final">
              <button type="submit" id="botao-cancelar-denuncia" th:href="@{/gestao-denuncias}">Cancelar</button>
              <button type="submit" id="botao-enviar-denuncia">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/rodape :: rodape-padrao}"></footer>
</body>
</html>
