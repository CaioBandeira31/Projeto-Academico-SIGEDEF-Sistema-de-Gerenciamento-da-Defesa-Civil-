<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes Denuncia</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/detalhes-denuncia.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,mail,call" />

</head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho-agente}"></header>
    
    <main>
      <div id="caixa-principal-denuncia">
        <div id="caixa-titulo-denuncia">
          <h1 id="titulo-denuncia">Ocorrencia: Protocolo</h1>
          <p id="subtitulo-denuncia"></p>
        </div>
        <div id="caixa-form-denuncia">
          <form th:action="@{/formdenuncia}" th:method="get">
            <div id="caixa-sup-denuncia">
              <div id="caixa-sup-esq">
                <h2 class="sequencia-denuncia">Informações da Ocorrencia</h2>
                <label for="endereco" class="label-denuncia">Endereço</label>
                <input type="text" id="endereco" readonly disabled>
                <div id="caixa-dados-endereco">
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco1">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" readonly disabled>
                  </div>
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco2">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" readonly disabled>
                  </div>
                  <div class="caixa-tipo-endereco" id="caixa-tipo-endereco3">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" readonly disabled>
                  </div>
                </div>
                <label for="referencia" readonly disabled>Ponto de Referência</label>
                <input type="text" id="referencia">
            </div>
            </div>
            <div id="caixa-inf-denuncia">
              <h2 class="sequencia-denuncia">Tipo de Ocorrência</h2>
              <div id="caixa-botoes">
                <button class="tipo-ocorrencia" id="ocorrencia1" type="button">Alagamento</button>
                <button class="tipo-ocorrencia" id="ocorrencia2" type="button">Risco de Desmoronamento</button>
                <button class="tipo-ocorrencia" id="ocorrencia3" type="button">Queda de Árvore</button>
                <button class="tipo-ocorrencia" id="ocorrencia4" type="button">Outros</button>
              </div>
              <h2 class="sequencia-denuncia">Descrição da Ocorrência</h2>
              <div id="descricao-fatos">
                <label for="descricao">Descrição dos fatos constatados</label>
                <textarea name="" id="descricao" cols="30" rows="10" maxlength="512"></textarea>
              </div>
              <div>
                <h2>Alterar Situação da Ocorrencia</h2>
                <select class="input-filtro" name="" id="">
                    <option value="" selected disabled hidden>Definir</option>
                    <option value="ANALISE">Em análise</option>
                    <option value="ANDAMENTO">Em andamento</option>
                    <option value="RESOLVIDA">Resolvida</option>
                </select>
              </div>
            </div>

            <div id="caixa-botoes-final">
              <button type="submit" id="botao-cancelar-denuncia">Cancelar</button>
              <button type="submit" id="botao-enviar-denuncia">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/rodape :: rodape-padrao}"></footer>
</body>
</html>
