<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pagina-envio-alertas.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail,call,account_circle" />

    <title></title>
</head>
<body>
    <div th:replace="~{fragments/formularios :: formulario-alerta}"></div>
    <header th:replace="~{fragments/cabecalho :: cabecalho-agente}"></header>
    
    <main>
        
        <div class="caixa-inicial">
            <div class="caixa-principal-alerta">
                <div id="caixa-botao-criar-alerta">
                        <a th:href="@{excluir-alertas}"><button type="button" id="botao-criar-alerta" th:href="@{excluir-alertas}">EXCLUIR HISTÓRICO</button></a>
                        <button type="button" id="botao-criar-alerta" onclick="novoAlerta()" >NOVO ALERTA</button>
                    </div>
                <div class="caixa-superior-titulo">
                    <h1 id="titulo-superior-alerta">Histórico</h1>
                    <p id="texto-superior-alerta">Gerencie seus alertas emitidos e crie novos comunicados de emergência para população</p>
                </div>
                
                <div class="cx-com-alertas">
                    <div class="caixa-central-card-alerta" th:each="alerta : ${alertas}">
                        <div class="caixa-titulo-card-alerta">
                            <h2 class="titulo-card-alerta">[[${alerta.titulo}]]</h2>
                            <p class="texto-da-datahora-da-emissão" th:text="${#temporals.format(alerta.dataHora, 'dd/MM/yyyy HH:mm')}"></p>
                        </div>
                        <div class="caixa-texto-card">
                            <h3 class="descricao-alerta-card">[[${alerta.mensagem}]]</h3>
                            <p class="regiao-afetada-alerta-card">Enviado por: [[${alerta.agente.nome}]]</p>
                        </div>
                    </div>
                </div>   
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/rodape :: rodape-padrao}"></footer>
    <script th:src="@{/js/popups.js}"></script>
</body>
</html>
