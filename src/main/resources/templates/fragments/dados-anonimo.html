<div th:fragment="dados-pessoais" id="dado-pessoal">
  <div id="caixa-dados-pessoais">
    <label for="nome">Nome Completo</label>
    <input type="text" id="nome" class="dado-anonimo" placeholder="Ex: Só mais um silva">
    <label for="cpf">CPF</label>
    <input type="number" id="cpf" class="dado-anonimo" placeholder="Ex: 123.456.789-01 ">
    <label for="dtnasc">Data de Nascimento</label>
    <input type="date" id="dtnasc" class="dado-anonimo">
  </div>
</div>
