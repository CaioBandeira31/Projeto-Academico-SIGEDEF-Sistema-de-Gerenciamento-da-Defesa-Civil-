<div th:fragment="dados-pessoais" id="dado-pessoal">
  <div id="caixa-dados-pessoais">
    <label for="nome">Nome Completo</label>
    <input type="text" id="nome" th:name="nome" class="dado-anonimo" placeholder="Ex: Só mais um silva">
    <label for="telefone">Telefone</label>
    <input type="number" id="telefone" th:name="telefone" class="dado-anonimo" placeholder="Ex: 86624822 ">
  </div>
</div>
